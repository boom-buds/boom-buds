# Checks and builds the game at every push to main, then publishes it at https://boom-buds.github.io/ by pushing the
# build to the boom-buds/boom-buds.github.io repository (GitHub serves an organization's root address only from a
# repository of that name; this one keeps the source). The push uses the WEBSITE_DEPLOY_TOKEN secret: a fine-grained
# personal access token, resource owner boom-buds, repository boom-buds.github.io only, Contents read and write
# (created 2026-11-23, no expiration; the org allows that since the same day).
# The game data (public/data) is in the repository: it is made from the original game with `npm run assets`. Every
# file of a build has content-hashed URLs and the build id is in version.json, so players get a new release at once
# (tools/build/versioning.ts, src/app/update.ts).
# TURN relay for players whose networks block direct connections: the repository variable TURN_API, a credentials
# API URL (Metered's /api/v1/turn/credentials?apiKey=...; it ends up in the published game, as any browser-side
# TURN credential does), or fixed relays: repository variables TURN_URLS (comma separated) and TURN_USERNAME,
# secret TURN_CREDENTIAL.
name: Deploy to boom-buds.github.io

on:
  push:
    branches: [main]
    # documentation changes do not change the game
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_TURN_API: ${{ vars.TURN_API }}
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      - name: Site files
        run: |
          cp tools/site/404.html dist/404.html
          touch dist/.nojekyll
      - name: Inject analytics script
        if: vars.TIDESIGHT_URL != '' && vars.TIDESIGHT_SITE_ID != ''
        env:
          ANALYTICS_URL: ${{ vars.TIDESIGHT_URL }}
          ANALYTICS_SITE: ${{ vars.TIDESIGHT_SITE_ID }}
        run: |
          python3 -c '
          import os, pathlib
          url, site = os.environ["ANALYTICS_URL"], os.environ["ANALYTICS_SITE"]
          tag = f"  <script async src=\"{url}\" data-site=\"{site}\"></script>\n"
          p = pathlib.Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          if url not in html:
              p.write_text(html.replace("</head>", tag + "</head>", 1), encoding="utf-8")
          '
      - name: Publish to boom-buds.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: boom-buds/boom-buds.github.io
          publish_branch: main
          publish_dir: ./dist
          # the website repository is a build output: one commit per release, no history to merge
          force_orphan: true
          user_name: 'boom-buds-bot'
          user_email: 'bot@users.noreply.github.com'
          commit_message: 'Release boom-buds/boom-buds@${{ github.sha }}'
